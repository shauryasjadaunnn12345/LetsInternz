<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}LetsInternz{% endblock %}</title>
</head>
<body style="margin:0; padding:0; background-color:#F5F7FA; font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#F5F7FA; padding:32px 16px;">
    <tr>
      <td align="center">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px; background-color:#FFFFFF; border-radius:16px; overflow:hidden; border:1px solid #E4E4E7;">

          <tr>
            <td style="background-color:#16213E; padding:24px 32px;">
              <table role="presentation" cellpadding="0" cellspacing="0">
                <tr>
                  <td style="background-color:#F2A93B; border-radius:8px; width:32px; height:32px; text-align:center; vertical-align:middle; font-size:16px; font-weight:700; color:#16213E;">&#8599;</td>
                  <td style="padding-left:10px; font-size:18px; font-weight:700; color:#FFFFFF;">LetsInternz</td>
                </tr>
              </table>
            </td>
          </tr>

          <tr>
            <td style="padding:32px;">
              {% block content %}{% endblock %}
            </td>
          </tr>

          <tr>
            <td style="padding:20px 32px; border-top:1px solid #E4E4E7;">
              <p style="margin:0; font-size:12px; color:#8A8F98; line-height:1.6;">
                You're receiving this because you have an account on LetsInternz.
                Manage your notification preferences anytime from
                <a href="{{ app_url }}/settings" style="color:#16213E;">Settings</a>.
              </p>
            </td>
          </tr>

        </table>
      </td>
    </tr>
  </table>
</body>
</html>
