name: Test & Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ---------------------------------------------------------------------
  # Django tests — SQLite (config.settings.development), same as local
  # `python manage.py test`. No Postgres/Redis service containers needed
  # since dev settings don't require them.
  # ---------------------------------------------------------------------
  test-backend:
    name: Django tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements/development.txt

      - name: Install dependencies
        run: pip install -r requirements/development.txt

      - name: Run tests
        env:
          DJANGO_SETTINGS_MODULE: config.settings.development
          SECRET_KEY: ci-test-secret-key-not-for-production
        run: python manage.py test users internships applications saved notifications

      - name: Django system check
        env:
          DJANGO_SETTINGS_MODULE: config.settings.development
          SECRET_KEY: ci-test-secret-key-not-for-production
        run: python manage.py check

  # ---------------------------------------------------------------------
  # Next.js build check — catches type errors, lint errors, and build
  # failures before they reach Amplify.
  # ---------------------------------------------------------------------
  test-frontend:
    name: Next.js build check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        env:
          NEXT_PUBLIC_APP_URL: https://letsinternz.com
          NEXT_PUBLIC_API_URL: /api
        run: npm run build

  # ---------------------------------------------------------------------
  # Deploy backend to EC2 — SSH in, pull, migrate, collectstatic, restart
  # the Gunicorn systemd service. See DEPLOY.md §4 for the one-time server
  # setup this assumes is already in place.
  # ---------------------------------------------------------------------
  deploy-backend:
    name: Deploy backend (EC2)
    needs: [test-backend, test-frontend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            cd /opt/letsinternz/backend
            git pull origin main
            source venv/bin/activate
            pip install -r requirements/production.txt
            python manage.py migrate --noinput
            python manage.py collectstatic --noinput
            sudo systemctl restart letsinternz
            sudo systemctl restart letsinternz-celery
            sudo systemctl restart letsinternz-celery-beat

  # ---------------------------------------------------------------------
  # Deploy frontend to Amplify — Amplify is already connected to this repo
  # (see DEPLOY.md §7) and builds on its own infrastructure; this just
  # triggers that build via webhook rather than re-implementing the build
  # here, so Amplify's build logs stay the source of truth for frontend
  # deploys.
  # ---------------------------------------------------------------------
  deploy-frontend:
    name: Deploy frontend (Amplify)
    needs: [test-backend, test-frontend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Amplify build
        run: |
          curl -f -X POST "${{ secrets.AMPLIFY_WEBHOOK_URL }}"
